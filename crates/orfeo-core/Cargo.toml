[package]
name = "orfeo-core"
version = "2.0.0"
edition = "2021"
authors = ["Abraham Grundt"]
description = "High-performance Rust Core Engine for Orfeo Mobile (iOS / macOS / Linux)"

[lib]
name = "orfeo_core"
crate-type = ["staticlib"]

[dependencies]
tokio = { version = "1.38", features = ["rt-multi-thread", "sync", "macros", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
